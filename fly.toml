# fly.toml
app = "nombre-de-tu-bot"  # Reemplaza esto con un nombre único para tu app
primary_region = "iad"     # La región más cercana a ti (ej. "mad" para Madrid)

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"  # Evita que el bot se apague por inactividad
  auto_start_machines = true
  min_machines_running = 1     # Mantiene al menos una instancia encendida
  max_machines_running = 1     # Evita múltiples instancias (y conexiones duplicadas a Discord)

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
